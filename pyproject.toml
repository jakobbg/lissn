[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lissn"
version = "0.2.0"
description = "Python audiobook and podcast indexer web application"
authors = [{ name = "Jakob Grimstveit" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "h2>=4.0.0",
    "jinja2>=3.1.0",
    "mutagen>=1.45.0",
    "markdown>=3.5.0",
    "pyyaml>=6.0.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx[http2]>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*httpx.*:Warning",
    "ignore:.*starlette.testclient.*:Warning",
    "ignore::Warning:fastapi.testclient",
]


